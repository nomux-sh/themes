[package]
name = "nomux-theme"
version = "0.3.0"
description = "The nomux theme loader: the semantic design tokens, theme files, the contrast rules and the iTerm import"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/nomux-theme"
readme = "README.md"
keywords = ["nomux", "theme", "design-tokens", "color", "contrast"]
categories = ["config", "gui", "command-line-utilities"]
# The package has the library, the `nomux-theme` command, the theme files and
# the tests. The tests examine the themes of the package.
include = ["src/**/*", "themes/*.toml", "tests/**/*", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
default = ["shipped"]
# Embeds the theme files of `themes/` in the library: the module `shipped`.
shipped = []

[dependencies]
roxmltree.workspace = true
toml.workspace = true

[lints]
workspace = true
