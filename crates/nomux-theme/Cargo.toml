[package]
name = "nomux-theme"
version = "0.2.0"
description = "The nomux theme loader: the semantic design tokens, theme files, the contrast rules and the iTerm import"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/nomux-theme"
readme = "README.md"
keywords = ["nomux", "theme", "design-tokens", "color", "contrast"]
categories = ["config", "gui", "command-line-utilities"]
# The package has the library and the `nomux-theme` command. The test of the
# shipped themes reads the `themes/` directory of the repository, thus it is
# not in the package.
include = ["src/**/*", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
roxmltree.workspace = true
toml.workspace = true

[lints]
workspace = true
