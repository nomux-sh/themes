# Configuration for git-cliff: https://git-cliff.org/docs/configuration
# The rules are in the release guide of the organization:
# https://github.com/nomux-sh/.github/blob/main/RELEASING.md
#
# Show the unreleased changes:  git cliff --unreleased
# Write the file for a release: git cliff --tag vX.Y.Z --output CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

[git-cliff](https://git-cliff.org) writes this file from the commit subjects.
To see the changes that are not in a version, run `git cliff --unreleased`.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\
"""
trim = false

[git]
conventional_commits = true
# A commit that is not a conventional commit is not in the changelog.
# The commitlint job in CI rejects such a commit before the merge.
filter_unconventional = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The first parser that matches a commit sets its group. The HTML comments set
# the sequence of the groups. The template removes them.
commit_parsers = [
    { message = "^[a-z]+!:", group = "<!-- 0 -->Breaking changes" },
    { message = "^feat:", group = "<!-- 1 -->Added" },
    { message = "^fix:", group = "<!-- 2 -->Fixed" },
    { message = "^perf:", group = "<!-- 3 -->Performance" },
    { message = "^refactor:", group = "<!-- 4 -->Changed" },
    { message = "^revert:", group = "<!-- 5 -->Reverted" },
    { message = "^docs:", group = "<!-- 6 -->Documentation" },
    # The other types, and a subject that the commit rules do not permit.
    { message = ".*", skip = true },
]
