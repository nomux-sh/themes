name: CI

# The shared jobs call the reusable workflows of the organization. The steps
# are in https://github.com/nomux-sh/.github/tree/main/.github/workflows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    uses: nomux-sh/.github/.github/workflows/rust-ci.yml@main
    with:
      # Linux only. The crate has no platform-specific code.
      os: '["ubuntu-latest"]'
      working-directory: .
      run-deny: true
      run-machete: true

  repo-lint:
    uses: nomux-sh/.github/.github/workflows/repo-lint.yml@main
    with:
      license: code
      require-changelog: true

  # The checks of the theme files. They do not wait for the Rust jobs.
  themes:
    name: themes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check the themes and the visual rules
        run: cargo run --locked -p nomux-theme -- check themes
      - name: Check the schema and the token reference
        run: scripts/check-generated.sh
      - name: Build the preview page
        run: cargo run --locked -p nomux-theme -- preview themes "$RUNNER_TEMP/index.html"

  # Builds the crate from the packaged files only, as crates.io users do.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo package
        run: cargo package -p nomux-theme --locked
      - name: Build with the minimum supported Rust version
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "nomux-theme") | .rust_version')"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check -p nomux-theme --locked

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color
